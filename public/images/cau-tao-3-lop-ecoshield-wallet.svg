<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="infogBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#18120f" />
      <stop offset="60%" stop-color="#0a0807" />
      <stop offset="100%" stop-color="#040303" />
    </radialGradient>
    <linearGradient id="layer1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b291e" />
      <stop offset="100%" stop-color="#1e140f" />
    </linearGradient>
    <linearGradient id="rfidMeshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261b15" />
      <stop offset="100%" stop-color="#140e0b" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#infogBg)" />

  <!-- Title Header -->
  <g transform="translate(600, 70)" text-anchor="middle">
    <rect x="-140" y="-30" width="280" height="32" rx="16" fill="#c88242" fill-opacity="0.15" stroke="#c88242" stroke-width="1.2" />
    <text x="0" y="-9" fill="#df9854" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" letter-spacing="2">
      KIẾN TRÚC VẬT LIỆU ĐỘC QUYỀN
    </text>
    <text x="0" y="32" fill="#f5efeb" font-family="'Playfair Display', serif" font-size="28" font-weight="bold">
      Cấu Tạo 3 Lớp & Dual-Zone Architecture™
    </text>
  </g>

  <!-- Diagram Visual Area: 3 Exploded Isometric Layers -->
  <g transform="translate(180, 200)">
    
    <!-- Layer 1: Coffee Bio-Composite (Outer Shell) -->
    <g transform="translate(0, 0)" filter="url(#softShadow)">
      <path d="M 120 40 L 480 40 L 380 140 L 20 140 Z" fill="url(#layer1Grad)" stroke="#c88242" stroke-width="2.5" />
      <!-- Stitch detail -->
      <path d="M 125 48 L 470 48 L 375 132 L 30 132 Z" fill="none" stroke="#df9854" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8" />
    </g>

    <!-- Annotation 1 -->
    <g transform="translate(520, 80)">
      <line x1="-30" y1="10" x2="30" y2="10" stroke="#c88242" stroke-width="1.5" />
      <circle cx="30" cy="10" r="4" fill="#c88242" />
      <text x="45" y="6" fill="#f5efeb" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">
        Lớp 01: Vỏ Composite Bã Cà Phê (1.0 - 1.3 mm)
      </text>
      <text x="45" y="26" fill="#b5a89e" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
        Tận dụng phụ phẩm cà phê Đắk Lắk, mềm dẻo, kháng nước, không nứt gãy.
      </text>
    </g>

    <!-- Layer 2: RFID Shielding Mesh (Middle) -->
    <g transform="translate(0, 110)" filter="url(#softShadow)">
      <path d="M 120 40 L 480 40 L 380 140 L 20 140 Z" fill="url(#rfidMeshGrad)" fill-opacity="0.85" stroke="#facc15" stroke-width="2" />
      <!-- Weave lines -->
      <path d="M 170 40 L 70 140 M 230 40 L 130 140 M 290 40 L 190 140 M 350 40 L 250 140 M 410 40 L 310 140" stroke="#ffffff" stroke-width="1" opacity="0.3" />
    </g>

    <!-- Annotation 2 -->
    <g transform="translate(520, 190)">
      <line x1="-30" y1="10" x2="30" y2="10" stroke="#facc15" stroke-width="1.5" />
      <circle cx="30" cy="10" r="4" fill="#facc15" />
      <text x="45" y="6" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">
        Lớp 02: Màng Chắn Sóng RFID 13.56 MHz (0.08 - 0.12 mm)
      </text>
      <text x="45" y="26" fill="#b5a89e" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
        Vải dẫn điện dệt Niken &amp; Đồng, triệt tiêu trường sóng quẹt trộm POS/NFC.
      </text>
    </g>

    <!-- Layer 3: Dual-Zone Inner Chamber + Apple Find My Tag (Bottom) -->
    <g transform="translate(0, 220)" filter="url(#softShadow)">
      <path d="M 120 40 L 480 40 L 380 140 L 20 140 Z" fill="url(#innerGrad)" stroke="#22c55e" stroke-width="2.5" />
      
      <!-- Card Compartment (Shielded Zone) -->
      <path d="M 90 60 L 260 60 L 210 120 L 40 120 Z" fill="#182330" stroke="#38bdf8" stroke-width="1.5" />
      <text x="140" y="95" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">
        VÙNG THẺ (RFID)
      </text>

      <!-- Smart Tag Separate Chamber (Unshielded Zone) -->
      <circle cx="320" cy="90" r="24" fill="#ffffff" stroke="#22c55e" stroke-width="2" />
      <circle cx="320" cy="90" r="8" fill="#22c55e" />
    </g>

    <!-- Annotation 3 -->
    <g transform="translate(520, 300)">
      <line x1="-30" y1="10" x2="30" y2="10" stroke="#22c55e" stroke-width="1.5" />
      <circle cx="30" cy="10" r="4" fill="#22c55e" />
      <text x="45" y="6" fill="#22c55e" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="bold">
        Lớp 03: Khoang Kép Dual-Zone &amp; Smart Tag Apple Find My
      </text>
      <text x="45" y="26" fill="#b5a89e" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
        Tách biệt hoàn toàn giúp sóng Bluetooth 2.4 GHz không bị cản trở bởi RFID.
      </text>
    </g>

  </g>

  <!-- Bottom Certification Bar -->
  <g transform="translate(600, 615)" text-anchor="middle">
    <rect x="-400" y="-20" width="800" height="38" rx="19" fill="#140f0d" stroke="#c88242" stroke-width="1" opacity="0.9" />
    <text x="0" y="4" fill="#eddccb" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">
      🧪 Thử nghiệm uốn gập 10.000 chu kỳ • 🛡️ Ngăn chặn 19/20 lần quét POS • 🔋 Pin Smart Tag 365 ngày
    </text>
  </g>
</svg>
