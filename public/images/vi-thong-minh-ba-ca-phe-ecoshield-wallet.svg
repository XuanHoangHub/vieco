<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1411" />
      <stop offset="60%" stop-color="#0e0a09" />
      <stop offset="100%" stop-color="#060404" />
    </radialGradient>
    <radialGradient id="coffeeGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c88242" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c88242" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34241b" />
      <stop offset="50%" stop-color="#241812" />
      <stop offset="100%" stop-color="#19110d" />
    </linearGradient>
    <linearGradient id="rfidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <linearGradient id="tagMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d8d8d8" />
      <stop offset="100%" stop-color="#9e9e9e" />
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <circle cx="600" cy="330" r="450" fill="url(#coffeeGlow)" />

  <!-- Coffee Beans Decor Scattered in Background -->
  <g opacity="0.3" fill="#301f16">
    <ellipse cx="200" cy="180" rx="22" ry="15" transform="rotate(35 200 180)" />
    <ellipse cx="230" cy="210" rx="18" ry="12" transform="rotate(-15 230 210)" />
    <ellipse cx="1020" cy="460" rx="24" ry="16" transform="rotate(65 1020 460)" />
    <ellipse cx="980" cy="500" rx="20" ry="13" transform="rotate(-40 980 500)" />
    <ellipse cx="160" cy="510" rx="26" ry="17" transform="rotate(20 160 510)" />
  </g>

  <!-- The EcoShield Bifold Wallet (Perspective) -->
  <g transform="translate(360, 160)" filter="url(#shadowFilter)">
    <!-- Wallet Outer Body (Coffee Bio-Composite) -->
    <rect x="0" y="0" width="480" height="310" rx="28" fill="url(#leatherGrad)" stroke="#4a3427" stroke-width="3" />
    
    <!-- Edge Stitching -->
    <rect x="14" y="14" width="452" height="282" rx="20" fill="none" stroke="#c88242" stroke-width="2" stroke-dasharray="8 6" opacity="0.75" />

    <!-- Center Spine Fold Line -->
    <line x1="240" y1="0" x2="240" y2="310" stroke="#120c09" stroke-width="4" opacity="0.9" />

    <!-- Embossed EcoShield Logo -->
    <g transform="translate(180, 240)">
      <circle cx="20" cy="20" r="18" fill="#1b120e" stroke="#c88242" stroke-width="1.5" />
      <path d="M20 10 L28 14 L28 22 C28 26 20 29 20 29 C20 29 12 26 12 22 L12 14 Z" fill="#c88242" opacity="0.9" />
    </g>

    <!-- Bank Card Peeking from Left Slot -->
    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="160" height="100" rx="10" fill="#15212d" stroke="#253a4f" stroke-width="1.5" />
      <rect x="18" y="24" width="30" height="22" rx="4" fill="url(#rfidGrad)" />
      <text x="18" y="75" fill="#8ba1b7" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2">•••• 8920</text>
    </g>

    <!-- Apple Find My Smart Tag in Dedicated Dual-Zone Compartment (Right Side) -->
    <g transform="translate(340, 130)">
      <!-- Chamber Ring -->
      <circle cx="45" cy="45" r="42" fill="#17100d" stroke="#c88242" stroke-width="2" opacity="0.6" />
      <!-- Smart Tag Metallic Disc -->
      <circle cx="45" cy="45" r="36" fill="url(#tagMetal)" stroke="#ffffff" stroke-width="1.5" />
      <!-- Radar Waves radiating from Tag -->
      <circle cx="45" cy="45" r="22" fill="none" stroke="#71717a" stroke-width="1" />
      <circle cx="45" cy="45" r="10" fill="#22c55e" opacity="0.9" />
      <text x="45" y="70" text-anchor="middle" fill="#52525b" font-family="sans-serif" font-size="8" font-weight="bold">Find My</text>
    </g>

    <!-- RFID Shielding Wave Indicator Overlay -->
    <g transform="translate(24, 24)" opacity="0.85">
      <rect x="0" y="0" width="190" height="30" rx="8" fill="#000000" fill-opacity="0.6" />
      <text x="12" y="20" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">🛡️ RFID 13.56 MHz BLOCKED</text>
    </g>
  </g>

  <!-- Title Badge on Image -->
  <text x="600" y="560" text-anchor="middle" fill="#f5efeb" font-family="'Playfair Display', serif" font-size="28" font-weight="bold" letter-spacing="1">
    EcoShield Wallet • Phụ Phẩm Cà Phê Việt Nam
  </text>
  <text x="600" y="595" text-anchor="middle" fill="#c88242" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" letter-spacing="3" text-transform="uppercase">
    Bảo Vệ Thẻ RFID 13.56 MHz • Tương Thích Apple Find My
  </text>
</svg>
